[package]
name = "fwaifu"
version = "1.1.0"
edition = "2024"
license = "MIT"
description = "Terminal anime girl viewer powered by fastfetch and chafa"
repository = "https://github.com/cublueer/fwaifu"
homepage = "https://github.com/cublueer/fwaifu"
keywords = ["terminal", "anime", "fastfetch", "cli", "chafa", "image"]
readme = "README.md"

[[bin]]
name = "fwaifu"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
rand = "0.8"
libc = "0.2"

