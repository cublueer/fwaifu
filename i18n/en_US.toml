[help]
text = """
fwaifu — Random anime girl generator for your terminal, powered by Fastfetch and chafa

Usage:
  fwaifu              Standard mode, random SFW image + system info
  fwaifu -n           NSFW mode (requires --login first)
  fwaifu -w           Watch mode, auto-refreshing
  fwaifu -w -n        NSFW watch mode

Mode Options:
  -n, --nsfw               Enable NSFW mode
  -w, --watch              Enable watch mode
      --watch-interval <S> Watch interval in seconds (default 5)

Network Options:
  -p, --proxy <URL>        Proxy URL (e.g. http://127.0.0.1:7890)

Display Options:
      --no-crop            Disable image cropping
      --crop-width <W>     Crop width (default 600)
      --crop-height <H>    Crop height (default 800)
      --logo-width <W>     Fastfetch image width (default 40)
      --term               Use chafa to display image in terminal
      --term-width <W>     chafa image width in characters (default: auto)

Account Options:
      --login              Login to Nekos.moe (saves token)
      --logout             Logout and clear token
      --status             Show login status

Cache & Save:
      --clean [sfw|nsfw]   Clear cache (omit = all)
  -s, --save [PATH]        Save last image (default ~/Pictures/fwaifu)

Other:
  -h, --help               Show this help
      --update             Check for updates
  -f, --force             Force reinstall (use with --update)
      --setting            Interactive configuration editor
      --version            Show version
      --completion <SHELL>  Generate shell completion (bash/zsh/fish)

Config:  ~/.config/fwaifu/config.toml
Env:     FWAIFU_PROXY
Priority: CLI args > Env > Config file
Image Source: Nekos.moe (https://nekos.moe)

Fastfetch native args can be appended after all options, e.g.:
  fwaifu --logo-width 30 --pipe false
"""
