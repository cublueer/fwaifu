[help]
text = """
========================================================
    fwaifu - Random Anime Girl Generator for Terminal
========================================================

Usage Modes:
  fwaifu              Standard mode. Shows a random SFW anime girl with system info.
  fwaifu -n / --nsfw  NSFW mode. Shows NSFW images (requires --login first).
  fwaifu -w / --watch Continuous watch mode. Refreshes every N seconds, great for a secondary monitor.
  fwaifu -w -n         Continuous NSFW watch mode.

Options:
  -h, --help                  Show this help message
  -n, --nsfw                  Enable NSFW mode
  -w, --watch                 Enable watch mode
  --watch-interval <SECONDS>  Watch interval in seconds (default 5)
  -p, --proxy <URL>           Set proxy URL (e.g. http://127.0.0.1:7890)
  --no-crop                   Disable image cropping
  --crop-width <WIDTH>        Crop target width (default 600)
  --crop-height <HEIGHT>      Crop target height (default 800)
  --logo-width <WIDTH>        Fastfetch logo display width (default 40)
  --login                     Interactive login to Nekos.moe (saves token)
  --logout                    Logout and clear stored token
  --status                    Show login status
  --clean [sfw|nsfw]           Clear SFW/NSFW cache (or all if omitted)
  -s, --save [PATH]             Save the last displayed image (default: ~/Pictures/fwaifu)
  --version                   Show version information

Configuration:
  Config file:  ~/.config/fwaifu/config.toml
  Environment:  FWAIFU_PROXY
  Priority:     CLI args > Environment > Config file

Image source: Nekos.moe API (https://nekos.moe)
========================================================
"""
