# fwaifu 配置文件
# 路径: ~/.config/fwaifu/config.toml
# 优先级: CLI 参数 > 环境变量 > 配置文件
# 
# 所有字段均为可选，未设置时使用默认值。

# ─── 显示模式 ─────────────────────────────────────────────────────────

# 使用 chafa 在终端中直接显示图片（需要安装 chafa）
# term = false

# chafa 输出宽度（字符列数），不设置则自动检测（终端宽度的 1/3）
# term_width = 40

# 代理地址 (支持 http/https 代理)
# 也可通过环境变量 FWAIFU_PROXY 设置
# proxy = "http://127.0.0.1:7890"

# ─── 图片裁剪 (需要安装 ImageMagick) ──────────────────────────────────

# 是否启用图片裁剪，默认 true
# crop = true

# 裁剪目标宽度 (像素)，默认 600
# crop_width = 600

# 裁剪目标高度 (像素)，默认 800
# crop_height = 800

# ─── 轮播模式 ─────────────────────────────────────────────────────────

# 轮播刷新间隔 (秒)，默认 5
# watch_interval = 5

# ─── Fastfetch 显示 ───────────────────────────────────────────────────

# 图片在 fastfetch 中的显示宽度 (字符列数)，默认 40
# logo_width = 40

# ─── 下载 ─────────────────────────────────────────────────────────────
[download]

# 每次补充库存时下载的图片数量，范围 1-50，默认 10
# batch_size = 10

# ─── 缓存 ─────────────────────────────────────────────────────────────
[cache]

# 最大库存数量 (超过后删除最旧的)，默认 100
# max_limit = 100

# 触发补货的最低库存阈值 (低于此值开始下载)，默认 60
# min_trigger = 60

# 已使用图片保留数量上限 (超过后删除最旧的)，默认 50
# max_used = 50

# 每次运行后是否清理 fastfetch 缩略图缓存，默认 true
# clean_cache = true

# ─── 保存 ─────────────────────────────────────────────────────────────

# SFW 图片默认保存路径（--save / -s 不指定路径时使用）
# save_path_sfw = "~/Pictures/fwaifu"

# NSFW 图片默认保存路径（--save / -s 不指定路径时使用）
# save_path_nsfw = "~/Pictures/fwaifu"
